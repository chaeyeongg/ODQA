###########################
# train 하이퍼파라미터 튜닝
###########################
program: src/odqa/train.py
name: Roberta_MRC_Hyperparameter_Tuning
project: ODQA_MRC_Tuning(Roberta_base_v3)
method: bayes
metric:
  name: exact_match
  goal: maximize

parameters:
  # 1. 학습률
  learning_rate:
    distribution: log_uniform_values
    min: 1e-6
    max: 5e-5

  # 2. 학습 에폭 수
  num_train_epochs:
    values: [3, 4, 5]

  # 3. 배치 크기
  # GPU 메모리에 따라 조절 (OOM 발생 시 8, 4로 줄이세요)
  per_device_train_batch_size:
    values: [8, 16]

  # 4. 가중치 감쇠 (Overfitting 방지)
  weight_decay:
    values: [0.0, 0.01, 0.1]

  # 5. 웜업 비율 (학습 초반 안정화)
  warmup_ratio:
    values: [0.0, 0.05, 0.1]

command:
  - ${env}
  - python
  - ${program}
  - ${args}
  # --- [고정 인자값] ---
  - --model_name_or_path
  - klue/roberta-large      # 사전학습 모델 이름
  - --dataset_name
  - ./data/train_dataset
  - --data_path
  - ./data
  - --output_dir
  - ./outputs/sweep_mrc_result
  - --do_train
  - --do_eval
  - --save_strategy
  - epoch
  - --eval_strategy
  - epoch
  - --logging_steps
  - 50
  - --report_to
  - wandb
  - --retrieval_type
  - bm25
  - --top_k
  - 10
  - --use_reranker
  - False
  - --fp16                  
  - --overwrite_output_dir
  - --run_name
  - sweep_run



# sweep.yaml
program: baseline/inference.py
name: Reranker_Hybrid_Top_k_Tuning
project: Reranker_Hybrid_Top_k_Tuning
method: bayes  # min/max 범위를 쓰려면 bayes나 random 추천
metric:
  name: eval_exact_match
  goal: maximize

parameters:
  top_k:
    values: [3, 5, 10]
  
  # 0.0 = BM25(Sparse) 100%
  # 1.0 = Dense 100%
  # 0.5 = 반반
  alpha:
    values: [0.1, 0.3, 0.5, 0.7, 0.9]

command:
  - ${env}
  - python
  - ${program}
  - ${args}
  - --model_name_or_path
  - ./outputs/train_result  # [필수] 미리 학습시켜둔 모델 경로
  - --dataset_name
  - ./data/train_dataset    # 평가할 데이터셋 (Validation)
  - --output_dir
  - ./outputs/sweep_result
  - --do_eval               # [필수] 평가 모드
  - --retrieval_type
  - hybrid                  # [필수] 검색 방식 (sparse / bm25)
  - --use_reranker
  - True
  - --eval_retrieval
  - True                    # [필수] 검색을 수행해야 top_k가 의미 있음
  - --data_path
  - ./data
  - --context_path
  - wikipedia_documents.json
